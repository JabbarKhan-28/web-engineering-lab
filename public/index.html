<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Engineering Lab 05</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Web Engineering Lab 05</h1>

      <section>
        <h2>Office Hours Schedule</h2>
        <table id="schedule">
          <thead>
            <tr>
              <th>Day</th>
              <th>Time</th>
              <th>Room</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Monday</td>
              <td>10:00–11:00</td>
              <td>Room 214</td>
              <td><button type="button" data-day="Monday">Book</button></td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td>14:00–15:00</td>
              <td>Room 214</td>
              <td><button type="button" data-day="Wednesday">Book</button></td>
            </tr>
          </tbody>
        </table>
        <p id="booking-status" aria-live="polite"></p>
      </section>

      <section>
        <h2>Feedback Form</h2>
        <form novalidate>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <button type="submit">Submit Feedback</button>
        </form>
        <p id="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="main.js"></script>
    <script type="module" src="feedback.js"></script>
  </body>
</html>
